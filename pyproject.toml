[tool.pytest.ini_options]
filterwarnings = [
    "ignore:Using `httpx` with `starlette.testclient` is deprecated"
]
markers = [
    "integration: marks tests as integration tests (deselect with '-m \"not integration\"')",
    "auth_required: marks tests that require authentication",
    "requires_params: marks tests that require query params",
    "no_rate_limit: marks tests that should bypass rate limiting",
    "usefixtures: marks tests that use fixtures",
    "skipif: marks tests that are conditionally skipped",
    "parametrize: parameterize a test function",
    "xfail: mark test as expected to fail",
    "filterwarnings: filter warnings for test runs"
]

[project]
name = "student-management-system"
version = "1.18.77"
description = "A comprehensive student management system"
readme = "README.md"
requires-python = ">=3.13"
license = "MIT"
authors = [
  { name = "ΜΙΕΕΚ Cyprus", email = "faltsasam@gmail.com" }
]
# No dependency lists here on purpose. The runtime dependencies are src/backend/requirements.txt
# and the development ones src/backend/requirements-dev.txt: those are what CI, the Docker image,
# the installers and Dependabot use. A second copy lived here and nothing installed from it; by
# 2026-11 it differed on 22 pins and could no longer be resolved (opentelemetry-api 1.45.2 next
# to opentelemetry-sdk 1.45.1, which requires the same version).

[tool.setuptools]
packages = ["backend"]
