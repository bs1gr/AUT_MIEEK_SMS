# SMS on a small cloud VM (plan todo 44): the single full-stack image, PostgreSQL stays on the
# QNAP and is reached over Tailscale. Linux only; DOCKER.ps1 is not used here.
#
#   cp .env.cloud.example .env    # then fill it in
#   docker compose -f docker-compose.cloud.yml up -d --build
#
# Runbook: docs/deployment/CLOUD_HOST_ORACLE.md
#
# In use since 2026-11-13 on the Oracle VM `sms-cloud` (arm64), built there from the checkout.
services:
  sms:
    # Built on the VM from this checkout (the VM's own CPU, so no emulation). If an image is
    # ever published for the release, set SMS_IMAGE and drop --build to pull it instead.
    image: ${SMS_IMAGE:-sms-fullstack:local}
    build:
      context: ../../..
      dockerfile: infra/docker/compose/Dockerfile.fullstack
    container_name: sms-cloud
    restart: unless-stopped
    environment:
      - SMS_ENV=production
      - SMS_EXECUTION_MODE=docker
      - SECRET_KEY=${SECRET_KEY:?SECRET_KEY must be set in .env}
      # The QNAP database over Tailscale (the NAS is a tailnet device itself; see the runbook).
      - DATABASE_ENGINE=postgresql
      - POSTGRES_HOST=${POSTGRES_HOST:?POSTGRES_HOST must be set in .env}
      - POSTGRES_PORT=${POSTGRES_PORT:-5432}
      - POSTGRES_DB=${POSTGRES_DB:?POSTGRES_DB must be set in .env}
      - POSTGRES_USER=${POSTGRES_USER:?POSTGRES_USER must be set in .env}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD:?POSTGRES_PASSWORD must be set in .env}
      - POSTGRES_SSLMODE=${POSTGRES_SSLMODE:-prefer}
      # Auth is always on here; the admin accounts already exist in the shared database, so no
      # DEFAULT_ADMIN_* is passed (a default admin on a shared database is a known hazard).
      - AUTH_ENABLED=True
      - AUTH_MODE=strict
      # The app is opened as https://<vm>.<tailnet>.ts.net (tailscale serve), so cookies are
      # HTTPS-only. The Android app's WebView origin is https://localhost.
      - COOKIE_SECURE=true
      - TRUSTED_HOSTS=${TRUSTED_HOSTS:?TRUSTED_HOSTS must name the VM, e.g. sms-cloud.example.ts.net}
      - CORS_ORIGINS=${CORS_ORIGINS:-https://localhost}
      - ENABLE_CONTROL_API=1
      # One small VM, a few dozen users: no Redis container.
      - REDIS_ENABLED=false
      # The database is ~65 ms away, so round trips are what a page waits for. These three cut
      # the ones that carry no data (see src/backend/remote_db_tuning.py and permission_cache.py).
      # Set any of them to 0 / false in .env to get the stock behaviour back.
      - DB_PRE_PING_IDLE_SECONDS=${DB_PRE_PING_IDLE_SECONDS:-20}
      - DB_AUTOCOMMIT_READS=${DB_AUTOCOMMIT_READS:-true}
      - PERMISSION_CACHE_TTL_SECONDS=${PERMISSION_CACHE_TTL_SECONDS:-30}
      # The automatic database backup: one encrypted file a day, the newest 30 kept. Backups
      # and the key that encrypts them are on the data volume, so they outlive a rebuild of
      # the image (inside the container both were lost at every update). This is the copy of
      # the shared database that is not on the NAS: see "Backups" in the runbook for how to
      # fetch a copy and the key to another machine.
      - BACKUPS_DIR=/data/backups
      - AUTO_BACKUP_ENABLED=${AUTO_BACKUP_ENABLED:-true}
      - AUTO_BACKUP_INTERVAL_HOURS=${AUTO_BACKUP_INTERVAL_HOURS:-24}
      - AUTO_BACKUP_KEEP=${AUTO_BACKUP_KEEP:-30}
      # The "alive and well" signal to a monitoring service outside (healthchecks.io or the
      # like): while the server runs, its database answers and its backup is in order, it
      # calls MONITOR_PING_URL at this pace; when the calls stop, the service tells you. Set
      # the address in .env (it is not in this file: whoever has it can send the signal).
      # See "Watching the server" in the runbook.
      - MONITOR_PING_URL=${MONITOR_PING_URL:-}
      - MONITOR_FAIL_URL=${MONITOR_FAIL_URL:-}
      - MONITOR_PING_MINUTES=${MONITOR_PING_MINUTES:-60}
      # Shown on the Privacy page (docs/admin/PRIVACY_AND_GDPR.md); empty = "ask the school office".
      # Fixed, not read from .env: Oracle's terms do not allow health data on this host.
      - HEALTH_DATA_ENABLED=false
      - PRIVACY_CONTROLLER_NAME=${PRIVACY_CONTROLLER_NAME:-}
      - PRIVACY_CONTACT=${PRIVACY_CONTACT:-}
      - PRIVACY_DPO_CONTACT=${PRIVACY_DPO_CONTACT:-}
      - PRIVACY_NOTICE_URL=${PRIVACY_NOTICE_URL:-}
    volumes:
      - sms_cloud_data:/data
    # Loopback only. Nothing listens on the VM's public address; `tailscale serve` on the host
    # publishes this port to the tailnet over HTTPS.
    ports:
      - "127.0.0.1:8000:8000"
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://127.0.0.1:8000/health || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 40s
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "5"

volumes:
  sms_cloud_data:
    driver: local
