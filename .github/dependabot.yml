# Dependabot version updates.
# Security updates are enabled in the repository settings (Settings -> Code
# security -> Dependabot security updates), not here: dependabot.yml has no
# such key, and an unknown top-level key makes the whole file invalid.

version: 2
updates:
  # Backend Python dependencies
  - package-ecosystem: "pip"
    directory: "/src/backend/"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 5
    allow:
      - dependency-type: "all"
    # One weekly PR for all minor/patch bumps; major bumps stay separate PRs.
    groups:
      pip-minor-patch:
        patterns:
          - "*"
        update-types:
          - "minor"
          - "patch"
    commit-message:
      prefix: "deps"
    labels:
      - "dependencies"
      - "security"

  # Frontend npm dependencies
  - package-ecosystem: "npm"
    directory: "/src/frontend/"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 5
    allow:
      - dependency-type: "all"
    # One weekly PR for all minor/patch bumps; major bumps stay separate PRs.
    groups:
      npm-minor-patch:
        patterns:
          - "*"
        update-types:
          - "minor"
          - "patch"
    commit-message:
      prefix: "deps"
    labels:
      - "dependencies"
      - "security"

  # GitHub Actions
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 5
    commit-message:
      prefix: "ci"
    labels:
      - "ci"
      - "dependencies"
