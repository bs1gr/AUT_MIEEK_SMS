name: PR Hygiene

on:
  pull_request:
    branches: [ main ]
    paths:
      - 'src/backend/**'
      - 'src/frontend/**'
      - 'scripts/**'
      - 'docs/**'
      - 'VERSION'
      - 'infra/scripts/ops/COMMIT_READY.ps1'
      - '.github/workflows/**'
      - 'pyproject.toml'
      - 'src/frontend/package.json'
      - 'src/frontend/package-lock.json'
      - 'src/backend/requirements*.txt'
      - 'infra/docker/**'
      - 'infra/installer/**'
      - 'infra/scripts/**'
  workflow_dispatch:

concurrency:
  group: pr-hygiene-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  pull-requests: write

jobs:
  version-consistency:
    name: Version Consistency
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - name: Verify version consistency
        shell: pwsh
        run: ./scripts/VERIFY_VERSION.ps1 -CheckOnly

  # COMMIT_READY -Quick runs in commit-ready-smoke.yml, which installs the
  # Python/Node dependencies it needs; running it here on a bare runner
  # could only fail (no node_modules, no backend deps).

  # Dependency review runs unconditionally on every PR to main via the
  # standalone dependency-review.yml workflow — kept out of this job list so
  # it isn't gated behind version-consistency/commit-ready finishing first.

