name: "Auto-approve Dependabot"

on:
  pull_request_target:
    types: [opened, synchronize]

permissions:
  contents: read

jobs:
  dependabot-auto-approve:
    runs-on: ubuntu-latest
    # GITHUB_TOKEN only approves; the merge uses a GitHub App token (below).
    # This job never checks out PR code.
    permissions:
      contents: read
      pull-requests: write
    # PR author, not github.actor: a human pushing to a Dependabot branch
    # must not get their change auto-approved.
    if: github.event.pull_request.user.login == 'dependabot[bot]' && github.actor == 'dependabot[bot]'
    steps:
      - name: Fetch Dependabot metadata
        id: metadata
        uses: dependabot/fetch-metadata@21025c705c08248db411dc16f3619e6b5f9ea21a # v2
        with:
          github-token: "${{ secrets.GITHUB_TOKEN }}"

      - name: Check GitHub CLI availability
        shell: bash
        run: |
          set -euo pipefail

          if ! command -v gh >/dev/null 2>&1; then
            echo 'GitHub CLI (gh) is not installed or not available on PATH. This workflow requires gh for Dependabot automation.'
            exit 1
          fi
          gh --version

      - name: Auto-approve minor/patch updates
        if: steps.metadata.outputs.update-type == 'version-update:semver-patch' || steps.metadata.outputs.update-type == 'version-update:semver-minor'
        run: gh pr review --approve "$PR_URL"
        env:
          PR_URL: ${{ github.event.pull_request.html_url }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # Patch updates auto-merge once the required checks pass. The merge must
      # not use GITHUB_TOKEN: GitHub starts no workflows for events caused by
      # GITHUB_TOKEN, so CI/E2E would never run on main after the merge. The
      # App is not a ruleset bypass actor, so auto-merge still waits for the
      # required checks and the approval.
      #
      # GitHub Actions bumps are left for a manual merge: they edit
      # .github/workflows/*, which an App token may only merge with the
      # Workflows permission, and the App deliberately doesn't have it.
      - name: Decide whether to auto-merge
        id: automerge
        shell: bash
        env:
          UPDATE_TYPE: ${{ steps.metadata.outputs.update-type }}
          ECOSYSTEM: ${{ steps.metadata.outputs.package-ecosystem }}
          HAVE_APP_CREDENTIALS: ${{ secrets.DEPENDABOT_MERGE_APP_CLIENT_ID != '' && secrets.DEPENDABOT_MERGE_APP_PRIVATE_KEY != '' }}
        run: |
          set -euo pipefail

          if [ "$UPDATE_TYPE" != "version-update:semver-patch" ] || [ "$ECOSYSTEM" = "github_actions" ]; then
            echo "enabled=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          if [ "$HAVE_APP_CREDENTIALS" != "true" ]; then
            echo "::error::Secrets DEPENDABOT_MERGE_APP_CLIENT_ID / DEPENDABOT_MERGE_APP_PRIVATE_KEY are not set (set both as Actions and Dependabot secrets). Auto-merge skipped - merge this PR by hand."
            exit 1
          fi
          echo "enabled=true" >> "$GITHUB_OUTPUT"

      - name: Create GitHub App token for the merge
        id: app-token
        if: steps.automerge.outputs.enabled == 'true'
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        with:
          client-id: ${{ secrets.DEPENDABOT_MERGE_APP_CLIENT_ID }}
          private-key: ${{ secrets.DEPENDABOT_MERGE_APP_PRIVATE_KEY }}
          permission-contents: write
          permission-pull-requests: write

      - name: Enable auto-merge for patch updates
        if: steps.automerge.outputs.enabled == 'true'
        run: gh pr merge --auto --squash "$PR_URL"
        env:
          PR_URL: ${{ github.event.pull_request.html_url }}
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
