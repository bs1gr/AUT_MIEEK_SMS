name: Manual Docker Publish and Release

on:
  workflow_dispatch:
    inputs:
      tag:
        description: 'Release tag to publish (e.g., v1.18.66). The image is built from this tag.'
        required: true
        type: string
      dry_run:
        description: 'Build only, from the dispatched ref: no push, nothing is published'
        required: false
        type: boolean
        default: false

env:
  DOCKER_REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  build-and-publish:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    env:
      DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
    outputs:
      digest: ${{ steps.build_and_push.outputs.digest }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Normalize and validate input tag
        id: version
        uses: ./.github/actions/normalize-version
        with:
          version: ${{ inputs.tag }}

      # A publish must contain the tagged release, not whatever ref the workflow was
      # dispatched on (the default branch usually carries unreleased commits).
      - name: Checkout the release tag
        if: ${{ !inputs.dry_run }}
        uses: actions/checkout@v7
        with:
          ref: refs/tags/${{ steps.version.outputs.version_tag }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v4
        with:
          registry: ${{ env.DOCKER_REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Log in to Docker Hub
        if: ${{ !inputs.dry_run && env.DOCKERHUB_USERNAME != '' }}
        uses: docker/login-action@v4
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Docker metadata
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: |
            ${{ env.DOCKER_REGISTRY }}/${{ env.IMAGE_NAME }}
            ${{ env.DOCKERHUB_USERNAME != '' && format('{0}/{1}', env.DOCKERHUB_USERNAME, github.event.repository.name) || '' }}
          tags: |
            type=raw,value=${{ steps.version.outputs.version_tag }}
            type=raw,value=latest

      - name: Build Docker image (pushed unless dry_run)
        id: build_and_push
        uses: docker/build-push-action@v7
        with:
          context: .
          file: ./infra/docker/compose/Dockerfile.fullstack
          push: ${{ !inputs.dry_run }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

