name: "Dependency Review"

on:
  pull_request:
    branches: [ main ]

permissions:
  contents: read
  pull-requests: write

jobs:
  dependency-review:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v7

      - name: Dependency Review
        uses: actions/dependency-review-action@v5
        with:
          fail-on-severity: high
          comment-summary-in-pr: always
          # An allow list, not a deny list: `deny-licenses` is deprecated (possible removal in the
          # action's next major version) and lets through every licence nobody thought to list.
          # These are the licences GitHub's dependency graph showed on 2026-11-21 (the owner:
          # "Allow today's licences"); GPL-3.0 and AGPL-3.0, the old deny list, are not among them.
          # A dependency with another licence fails the review until it is checked and either
          # its licence added here or the package named in allow-dependencies-licenses (purl).
          # A licence GitHub cannot detect only warns.
          allow-licenses: >-
            0BSD, Apache-2.0, BlueOak-1.0.0, BSD-2-Clause, BSD-2-Clause-Views, BSD-3-Clause,
            CC-BY-4.0, CC0-1.0, ISC, LGPL-2.0-or-later, LGPL-3.0-only, LGPL-3.0-or-later,
            LicenseRef-scancode-protobuf, LicenseRef-scancode-public-domain,
            LicenseRef-scancode-unicode, MIT, MIT-0, MPL-2.0, PSF-2.0, Python-2.0, Unlicense
