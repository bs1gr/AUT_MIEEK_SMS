name: Trivy Security Scan

on:
  schedule:
    - cron: '0 3 * * 1'
  workflow_dispatch:

# NOTE: The main CI/CD pipeline already runs a Trivy Docker filesystem scan
# for PRs and pushes, so this workflow is scheduled/manual only to avoid
# duplicate GitHub Security SARIF uploads in the same repository.

concurrency:
  group: trivy-${{ github.ref }}
  cancel-in-progress: true

jobs:
  trivy-fs-scan:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Run Trivy filesystem scan
        uses: aquasecurity/trivy-action@57a97c7e7821a5776cebc9bb87c984fa69cba8f1 # v0.35.0
        with:
          scan-type: fs
          format: sarif
          output: trivy-results.sarif
          ignore-unfixed: true
          severity: HIGH,CRITICAL
          vuln-type: os,library

      - name: Upload Trivy scan artifact for drift review
        uses: actions/upload-artifact@v7
        with:
          name: trivy-scan-report
          path: trivy-results.sarif
          retention-days: 30
